<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML to PDF</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md text-center">
    
    <h1 class="text-2xl font-bold mb-4">HTML → PDF Converter</h1>
    
    <form id="uploadForm" class="space-y-4">
        
        <div id="dropZone" 
             class="border-2 border-dashed border-gray-300 p-6 rounded-xl cursor-pointer hover:bg-gray-50">
            <p class="text-gray-500">Drag & drop HTML file here</p>
            <p class="text-sm text-gray-400">or click to browse</p>
            <input type="file" name="file" id="fileInput" accept=".html" class="hidden">
        </div>

        <p id="fileName" class="text-sm text-gray-600"></p>

        <button type="submit"
            class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 w-full">
            Convert to PDF
        </button>
    </form>

    <div id="loading" class="hidden mt-4 text-blue-500">
        Converting... ⏳
    </div>

</div>

<script src="/static/script.js"></script>
</body>
</html>
